# Review paid compute and region before applying. This file does not create resources by itself.
# Enter sync: false values in Render; never commit credentials.
# Production services inherit main from the Blueprint; keep infrastructure auto-sync disabled.
services:
  - type: web
    name: pidsklom-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - data/seed/**
        - data/images/**
        - .dockerignore
        - render.yaml
        - .github/workflows/ci.yml
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_BACKEND
        value: supabase
      - key: AI_PROVIDER
        value: llm
      - key: AUTH_MODE
        value: supabase
      - key: GUEST_LIMIT_ENABLED
        value: "true"
      - key: GUEST_EXPORT_LIMIT_ENABLED
        value: "true"
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      - key: SUPABASE_JWT_ALGORITHM
        value: ES256
      - key: INCLUDE_UNREVIEWED
        value: "false"
      - key: MATCH_MODE
        value: embeddings
      - key: EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIM
        value: "768"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: pidsklom-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
        - .github/workflows/ci.yml
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: pidsklom-api
          envVarKey: PUBLIC_BASE_URL
      - key: VITE_AUTH_MODE
        value: supabase
      - key: VITE_SUPABASE_URL
        fromService:
          type: web
          name: pidsklom-api
          envVarKey: SUPABASE_URL
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
