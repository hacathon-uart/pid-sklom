# Render blueprint (T02). Render dashboard → New → Blueprint → pick this repo.
# Secrets marked sync: false are entered in the dashboard, never committed.
services:
  - type: web
    name: pidsklom-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_BACKEND
        value: local          # switch to supabase once SupabaseRepository is implemented
      - key: AI_PROVIDER
        value: stub           # switch to llm once LLMProvider is implemented
      - key: AUTH_MODE
        value: stub           # switch to supabase with T22
      - key: INCLUDE_UNREVIEWED
        value: "false"        # live site shows only artworks with review_status «approved»
      - key: PUBLIC_BASE_URL
        sync: false           # https://pidsklom-api.onrender.com
      - key: FRONTEND_ORIGINS
        sync: false           # https://<project>.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
