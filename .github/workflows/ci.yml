name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node scripts/check_auth_browser.mjs
        working-directory: .
      - run: BROWSER_WIDTH=390 node scripts/check_auth_browser.mjs
        working-directory: .
      - run: BROWSER_WIDTH=390 AUTH_BROWSER_CASE=share-link node scripts/check_auth_browser.mjs
        working-directory: .
      - run: node scripts/check_story_browser.mjs && node scripts/check_accessibility_browser.mjs
        working-directory: .
      - run: npm run smoke:mobile

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t pidsklom-api:check .
      - run: docker build -f frontend/Dockerfile -t pidsklom-web:check .
      - run: python3 scripts/check_containers.py
      - run: python3 scripts/check_auth_database.py
